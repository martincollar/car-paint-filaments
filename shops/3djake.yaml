# Crawl-delay 10 s, so discovery is limited to Fiberlogy Easy PLA/PETG and ASA. Widen `include` to add brands.
# pins: hand-written products from before sitemap discovery; discovery finds them too, the pin only
# keeps their brand, material, colour name and photo file (so measured colours) stable. Pins skip include/exclude
# and the title check (not the finish ban), so never pin what the rules would reject (2.85 mm, 0.5 kg …).
name: 3DJake
platform: generic
regions: [eu]
base: https://www.3djake.cz
sitemap: https://www.3djake.cz/sitemap-p.xml
include:
- ^/fiberlogy/(easy-(pla|petg)|asa)-
default_brand: Fiberlogy
pins:
- url: https://www.3djake.cz/fiberlogy/easy-petg-pastel-blue
  brand: Fiberlogy
  material: PETG
  color_name: Pastel Blue
  local_image: fiberlogy-easy-petg-pastel-blue.jpg
- url: https://www.3djake.cz/fiberlogy/easy-petg-pastel-mint
  brand: Fiberlogy
  material: PETG
  color_name: Pastel Mint
  local_image: fiberlogy-easy-petg-pastel-mint.jpg
- url: https://www.3djake.cz/fiberlogy/easy-pla-green
  brand: Fiberlogy
  material: PLA
  color_name: Green
  local_image: fiberlogy-easy-pla-green.jpg
- url: https://www.3djake.cz/fiberlogy/easy-pla-pastel-blue
  brand: Fiberlogy
  material: PLA
  color_name: Pastel Blue
  local_image: fiberlogy-easy-pla-pastel-blue.png
- url: https://www.3djake.cz/fiberlogy/easy-pla-pastel-mint
  brand: Fiberlogy
  material: PLA
  color_name: Pastel Mint
  local_image: fiberlogy-easy-pla-pastel-mint.jpg
