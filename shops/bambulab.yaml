# Bambu Lab EU store (international shop). The store is a Next.js app: each material is one parent page
# and the colours are variants, so every colour is a pin. image_url is the store's flat colour swatch
# (its official colour square), the page is fetched for nothing but robots/liveness (availability_from_page: false).
# Single-colour lines only: PLA Basic / Matte / Tough+ / Pure / Metal / Sparkle, PETG Basic / HF / Matte, ASA.
# Left out: Marble, Galaxy (multi-tone), Aero (foamed), Gradient / Silk Multi Color, Silk+, Translucent, CF, Glow, Wood.
# Regenerate the pins when Bambu adds a colour: open the parent page and copy the Color selector entries.
name: Bambu Lab
platform: manual
regions: [eu, int]
base: https://eu.store.bambulab.com
default_brand: Bambu Lab
