# Rules shared by every shop. A shop's own `exclude` list is appended to this one;
# `materials` and the numeric limits can be overridden per shop.
# All regexes match diacritics-folded, lowercased text ("průhledná" → "pruhledna").

# Regions a filament can be sold in, in page order (key: label shown on the toggle).
# Every shop lists its own in `regions:` (one or more); a filament belongs to its shop's regions.
# To add one (e.g. us: "US"), add it here and tag the shops.
regions:
  eu: "EU / CZ"
  int: "INT"

# Finishes we never print with. Applied to slug, URL, product title and colour name
# of EVERY record — discovered, pinned, and legacy
# (measure_filaments.py drops them again as a safety net).
exclude_finishes:
  transparent: '\btransparent\w*|\btranslucent\w*|\bpruhledn\w*|\bpruhled\w*|\bcir(a|e|y|i|ou)\b|\bclear\b'
  natural:     '\bnatur\w*|\bprirodn\w*'
  silk:        '\bsilk\w*|\bhedvab\w*'
  stone:       '\bmarble\w*|\bmramor\w*'

# Effects the shop itself declares in the product's parameter table (shoplib.product_attrs, upgates
# markup), matched as "parameter=value" on diacritics-folded text. Not a colour-name keyword: a plain
# PLA called "Kámen" has no such parameter. Stone effect = marble, sandstone, brick, "kámen" lines
# (Spectrum PLA Special, Devil Design, Lume, ...): textured, not a single-colour spool.
# Shops without a parameter table (3DFox, ...) are caught by the `stone` keywords in exclude_finishes.
exclude_attrs:
  stone: '^doplnujici cleneni=efekt\W*kamen'

# Neon / fluorescent colours. Not banned, but flagged `neon: true` on the record
# (measure_filaments.py) and ranked behind normal filaments in compute_matches.py:
# on a car they only look right when the paint itself is neon. Diacritics-folded
# regex on colour name and slug (hyphens read as spaces). Their photos also measure
# too dark (shaded sides pull the median down), so plain ΔE flatters them.
neon_names: '\bfluo\w*|\bneon\w*|\buv\b|\bhighlight\b|\bsuper (yellow|zluta)\b'

# Surface finishes. Not banned: every record gets `finish: [..]` (measure_filaments.py) and the
# page header has one on/off toggle per finish; `filter_defaults` in car.json says which are on
# for that car (missing = off). Diacritics-folded regexes (hyphens read as spaces) on colour name,
# title and slug, Czech and English. Order = order of the toggles. `matov*` is deliberately NOT
# a matt keyword: "mátová" (mint) folds to the same word.
finish_flags:
  glitter: '\bglitt\w*|\bsparkl\w*|\bgalax\w*|\bmetal\w*|\btrpyt\w*|\bstardust\b|\bstarlight\b|\bstar\b|\bglamou?r\b|\bbril+i?ant\b|\bdiamond\b|\baurora\b|\bshimmer\w*|\bsugar\b|\bpearl\w*|\bperl\w*|\biridescen\w*|\bchameleon\b|\bflip\b|\bvertigo\b'
  matt:    '(?<!semi )(?<!half )(?:\bmat\b|\bmatt\w*|\bmatn\w*)|\bsoft touch\b|\bvelvet\w*|\bsuede\b'
  satin:   '\bsatin\w*|\bsaten\w*|\bsatyn\w*|\b(semi|half|pol[ao]) ?mat\w*'

# URL-path excludes: things that are not a single-colour 1.75 mm ~1 kg spool.
exclude:
  - '(^|-)pla-special(-|$)'
  - 'vzor|sample|probe|tester|(^|-)\d+-?pack(-|$)'
  - 'bundle|balicek|multipack|multi-pack|\bbox\b|-box-|(^|[-/])sada([-/]|$)|(^|[-/])set([-/]|$)|-kopie|/akce-|/akcia-'
  - '2-85|2[.,]85|285-?mm'
  - '(^|[-/])(2|3|4|5|8|10)-?kg'
  - '(^|[-/])(2|3|4|5)000-?g([-/]|$)'
  - '(^|[-/_])(c|g)f\d*([-/_]|$)|kevlar|flameguard|safeguard|(^|[-/])asa-x([-/]|$)'
  - '(^|[-/])(cf|carbon|karbon|wood|drevo|woodjet|glow|svitici|tungsten|magnetite?)([-/]|$)'
  - 'rainbow|duhov|multicolou?r|tricolou?r|dual-colou?r|gradient|dvoubarev|dvojbarev|tribarev|trojbarev|termo|thermo|chameleon|kameleon'
  - '(^|[-/])(abs|tpu|tpe|pc|pa|nylon|pva|hips|pp)([-/]|$)'

# First match wins (on URL path + product title).
materials:
  PETG: '(^|[^a-z])pet-?g([^a-z]|$)'
  PLA+: '(^|[^a-z])pla(\+|-?plus)'
  PLA:  '(^|[^a-z])pla([^a-z]|$)'
  ASA:  '(^|[^a-z])asa([^a-z]|$)'

material_in_url: true   # URL must already name PLA/PETG/ASA (cheap pre-filter before any page fetch)
max_new_per_run: 300   # cap on never-seen product pages fetched in one run (first crawl spreads over runs)
refresh_days: 7        # re-fetch a known product page (stock) when the cached copy is older
min_keep_ratio: 0.8    # refuse to overwrite a shop's raw JSON if it would shrink below 80 %

# Per-brand hints for color_tools.filament_rgb(), matched on the record's brand
# (case-insensitive regex). Use only for a brand whose photos share one layout.
measure_hints:
  # Black slightly bluish spool + grey "A" stand next to every winding: ignore
  # near-achromatic dark pixels when picking the hue, or pastels measure as the spool.
  'aurapol': {min_chroma: 0.06}
  # Blue-grey (lavender-looking) SUNLU spool with a navy hub, hue ~220°, next to pale
  # marble windings: drop that band or every SUNLU colour measures as the spool (#767C93).
  'sunlu': {drop_hue_band: [205, 240, 0.05, 1.0]}

# One brand sold by several shops under different (often translated) names: keep the preferred
# shop's record and drop the other shops' twins (same brand + material, measured colour within
# `dedupe_delta_e`, matched one-to-one nearest first). brand regex -> shop name. Other brands keep
# every shop, because each shop link is a real choice for the buyer.
preferred_shop:
  '^aurapol$': Aurapol
dedupe_delta_e: 2
# Materials where the preferred shop is the only source: every other shop's listing of that brand is
# dropped, twin or not (the other shops just resell it). Aurapol ASA: only the Aurapol store.
preferred_shop_exclusive: [ASA]
