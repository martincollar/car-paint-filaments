# Deploy committed car pages to GitHub Pages. Nothing is rebuilt here: the
# filament photos are gitignored, so HTML is built locally and committed
# (scripts/rebuild*.sh), then scripts/build_site.sh only assembles _site/.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "cars/*/output/**"
      - "cars/*/car.json"
      - "scripts/build_site.sh"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
